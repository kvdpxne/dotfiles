# Defines the primary wallpaper source and its display behaviour.
# https://wiki.hypr.land/hypr-ecosystem/hyprpaper/#setting-wallpapers
wallpaper {
    monitor =
    # The wallpaper image file. This path is a symlink managed by `darkman`,
    # which updates the link to point to a light‑ or dark‑theme wallpaper
    # based on the current system theme. This allows seamless switching
    # without re‑loading the configuration.
    path = ~/.current_wallpaper
    fit_mode = cover
    timeout = 30
    order = random
    recursive = false
}

# Controls the "splash" text overlay on the wallpaper.
# https://wiki.hypr.land/hypr-ecosystem/hyprpaper/#misc-options
splash = false
splash_offset = 20
splash_opacity = 0.8

# Enables the IPC socket, allowing external tools (e.g., scripts, keybindings)
# to change wallpapers on‑the‑fly. This is essential for dynamic wallpaper
# switching triggered by theme changes or user commands. Without it, the
# wallpaper can only be changed by reloading the entire configuration.
ipc = true

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

animations {
    enabled = true
}

bezier = custom, 0.25, 0.1, 0.25, 1
animation = fadeIn, 1, 1.5, custom
animation = fadeOut, 1, 0.8, custom

background {
    monitor =
    path = ~/.current_wallpaper_blur
    color = rgba(17, 17, 17, 1.0)
    blur_passes = 0
    blur_size = 0
    noise = 0.0217
    contrast = 0.8916
    brightness = 0.5172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
    reload_time = -1
    reload_cmd =
    crossfade_time = -1.0
    zindex = -1
}

shape {
    size = 420, 340
    rounding = 10
    color = rgba(20, 22, 30, 0.85)
    border_size = 1
    border_color = rgba(122, 162, 247, 0.25)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.55)
}

label {
    text = cmd[update:0] echo "Welcome to $(cat /etc/hostname)"
    color = rgba(192, 202, 245, 1)
    font_size = 22
    font_family = Noto Sans
    position = 0, 20
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] LANG=en_US.UTF-8 date '+%A, %d %B %Y'
    color = rgba(200, 200, 220, 0.9)
    font_size = 18
    font_family = Noto Sans
    position = 0, -45
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] LANG=en_US.UTF-8 date '+%H:%M'
    color = rgba(255, 255, 255, 1)
    font_size = 52
    font_family = Noto Sans
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
}

input-field {
    size = 340, 56
    outline_thickness = 3
    outline_color = rgba(122, 162, 247, 0.8)
    inner_color = rgba(30, 34, 45, 0.95)
    font_color = rgba(255, 255, 255, 1)
    dots_size = 0.35
    dots_spacing = 0.25
    dots_center = true
    fade_on_empty = false
    placeholder_text = Enter password...
    hide_input = false
    rounding = 14
    check_color = rgba(100, 200, 100, 1)
    fail_color = rgba(200, 70, 70, 1)
    capslock_color = rgba(255, 200, 50, 1)
    swap_font_color = false
    position = 0, 95
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
    fail_text = <i>Invalid password! <b>($ATTEMPTS)</b></i>
    check_text = <i>Checking...</i>
}

shape {
    size = 90, 40
    rounding = 8
    color = rgba(20, 22, 30, 0.85) 
    border_size = 1
    border_color = rgba(122, 162, 247, 0.3)
    position = -165, -320
    halign = center
    valign = top
    zindex = 0
}

label {
    text = cmd[update:5000] echo "󰁹  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    font_family = Noto Sans
    position = -170, -327
    halign = center
    valign = top
    zindex = 1
}


# Performance
# Increase repaint_delay to reduce screen updates and CPU wakeups.
# Default 10 ms (~100 FPS). 18 ms (~60 FPS) is still smooth for typing
# and scrolling, but significantly lowers power draw.
repaint_delay 18

# Increase input_delay to batch input processing. Default 3 ms.
# 6–8 ms reduces CPU wakeups without a noticeable typing lag for most users.
input_delay 6

# Keep sync_to_monitor enabled to avoid tearing and prevent unnecessary
# frames when the screen content hasn't changed. If you experience
# scroll stutter on the Intel iGPU, try disabling VFR in Hyprland first.
sync_to_monitor yes

# Disable update checking. Arch packages are managed by pacman, and this
# avoids periodic network wakeups.
update_check_interval 0

# Disable the audio bell (saves a tiny amount of CPU and avoids surprises).
enable_audio_bell no
visual_bell_duration 0.0

# Disable cursor blinking. A non-blinking beam cursor eliminates repeated
# screen redraws, which is one of the easiest battery wins in a terminal.
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Disable dynamic background opacity (it has a performance cost).
dynamic_background_opacity no

# OS specific tweaks
linux_display_server wayland

# Disable IME unless you actively use fcitx5 or another input method.
# IME adds latency and CPU wakeups on Wayland.
wayland_enable_ime no

# Font
font_family JetBrainsMono Nerd Font
font_size 11.0
bold_font auto
bold_italic_font auto
italic_font auto

# Slightly thicker text composition helps readability on the ThinkPad's
# matte display without enabling heavy font smoothing. 
text_composition_strategy 1.0 30

# Color scheme
foreground #cdd6f4
background #1e1e2f
selection_foreground #1e1e2f
selection_background #f5e0dc

cursor #f5e0dc
cursor_text_color background

url_color #89b4fa
url_style curly

color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2 #a6e3a1
color10 #a6e3a1
color3 #f9e2af
color11 #f9e2af
color4 #89b4fa
color12 #89b4fa
color5 #f5c2e7
color13 #f5c2e7
color6 #94e2d5
color14 #94e2d5
color7 #bac2de
color15 #a6adc8

# Keep opacity high for readability and to reduce GPU compositing work.
# Hyprland will still apply its own blur/opacity rules if configured.
background_opacity 1.0
background_blur 0

# Window layout
# Let Hyprland handle window decorations and borders.
hide_window_decorations yes

# Disable close confirmation to avoid accidental focus grabs.
confirm_os_window_close 0

# Minimal padding, less area to repaint.
window_padding_width 2
placement_strategy center

# Remember window size but not position (position is managed by Hyprland).
remember_window_size yes
remember_window_position no

# Enable only the layouts you actually use. Fewer layouts = less state.
enabled_layouts splits, tall, stack

# Tabs
# Show the tab bar only when 3+ tabs are open to save vertical space
# and avoid unnecessary rendering for single-tab workflows.
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2

tab_title_template "{index}: {title}{bell_symbol}{activity_symbol}"
active_tab_foreground #1e1e2e
active_tab_background #89b4fa
active_tab_font_style bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
inactive_tab_font_style normal

# Scrollback
# 100,000 lines is roughly 100–200 MB for typical text and gives you
# days of history. Memory is allocated on demand, so idle sessions
# with little output use almost nothing.
scrollback_lines 100000

# Separate scrollback buffer for the pager. 128 MB is comfortable
# on a 32 GB machine and lets you grep through very long histories
# in `less` without losing context.
scrollback_pager_history_size 128

# Use a lightweight pager for browsing scrollback.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Reduce scroll multipliers slightly to avoid excessive redraws on
# low-precision wheel mice. Adjust to taste.
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 1.0
pixel_scroll yes

# Disable the scrollbar entirely (saves rendering area and GPU work).
# If you prefer a scrollbar, use `scrollbar scrolled` with low opacity.
scrollbar never

# Shell integration
# Enable shell integration but disable non-essential features to
# reduce background activity (cwd tracking, title updates, etc.).
shell_integration enabled no-rc no-cwd no-title

# Keyboard shortcuts
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+shift+q close_tab
map ctrl+shift+n new_os_window
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
